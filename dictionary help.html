<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home - Dictionary</title>

  <!-- favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/tTPY6dm1/image.png" />

  <style>
    body {
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      font-family:sans-serif;
      background:url("https://i.ibb.co/yc08crzH/20250923-0635-Starry-Arabic-Skies-simple-compose-01k5t1nc7kf4y8jv4ma4ctgmwe.png") no-repeat center center fixed;
      background-size:cover;
      color:#fff;
      text-align:center;
      padding:20px;
      box-sizing:border-box;
    }

    header {
      margin-top:20px;
    }

    h1 {
      margin:0.5rem 0;
      font-size:2.4rem;
      text-shadow:0 0 8px #000;
      font-family:'Times New Roman', Times, serif;
    }

    img.logo {
      width:150px;
      max-width:200px;
      height:auto;
    }

    nav {
      margin-top:2rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
      width:100%;
      max-width:300px;
    }

    .nav-btn {
      background:greenyellow;
      border:none;
      border-radius:8px;
      padding:0.8rem;
      font-size:1.2rem;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
      transition:transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform:scale(1.05);
      box-shadow:0 6px 12px rgba(0,0,0,0.5);
    }

    footer {
      margin-top:auto;
      padding:1rem;
      font-size:0.9rem;
      color:#ddd;
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="https://i.ibb.co/RG0sDPmk/image.png" alt="البحير logo">
    <h1>THANK YOU</h1>
  </header>

  <nav>
    <button class="nav-btn" onclick="window.location.href='dictionary home.html'">Dictionary</button>
    <button class="nav-btn">About Us</button>
    <button class="nav-btn">Contact</button>
    <button class="nav-btn">Settings</button>
  </nav>

  <footer>
    &copy; 2025 Dictionary Project by Shahid Bilal MN
  </footer>
</body>
</html>
